[project]
name = "shorts-cuter-backend"
version = "0.1.0"
description = "Shorts Cuter backend - FastAPI + Beanie"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "beanie>=2.0.0",
    "pydantic>=2.8.0",
    "pymongo>=4.13.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "yt-dlp>=2024.8.6",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.33.0",
    "google-auth-oauthlib>=1.2.1",
    "arq>=0.26.0",
    "anthropic>=1.0.0",
    "faster-whisper>=1.0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
