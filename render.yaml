services:
  - type: web
    name: shorts-cuter-backend
    env: docker
    plan: free
    dockerfilePath: backend_py/Dockerfile
    dockerContext: backend_py
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: STORAGE_DIR
        value: /app/storage
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YT_REDIRECT_URI
        sync: false
      - key: REDIS_URL
        sync: false
    disk:
      name: storage
      mountPath: /app/storage
      sizeGB: 1

  - type: static
    name: shorts-cuter-frontend
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    headers:
      - path: /**
        name: Cache-Control
        value: public, max-age=600
    envVars:
      - key: VITE_API_URL
        # Replace with your backend Render URL after the first deploy.
        value: https://shorts-cuter-backend.onrender.com
